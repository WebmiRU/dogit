{{- if .Values.app.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dogit.fullname" . }}-app-data
  labels:
    {{- include "dogit.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.app.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.app.persistence.size }}
  {{- if .Values.app.persistence.storageClassName }}
  storageClassName: {{ .Values.app.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
