{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress.enabled=true" }}
{{- end }}
{{- if and .Values.ingress.tls.enabled (not .Values.certManager.enabled) }}
{{- fail "ingress.tls.enabled requires certManager.enabled=true; the chart does not expect a pre-created TLS Secret" }}
{{- end }}
{{- $annotations := dict -}}
{{- if eq .Values.ingress.className "nginx" }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-body-size" "8m" -}}
{{- if .Values.ingress.tls.enabled }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/ssl-redirect" "true" -}}
{{- end }}
{{- else if eq .Values.ingress.className "traefik" }}
{{- if .Values.ingress.tls.enabled }}
{{- /* Both entrypoints, not just websecure: with websecure alone Traefik owns no
       route for plain HTTP on :80 and answers 404 there, so the site is reachable
       only by typing https://, which reads as "the domain is dead" to anyone who
       tried http:// first.
       Note there is deliberately NO router.tls annotation here. That annotation is
       a filter on req.TLS, so setting it alongside "web" silently defeats the whole
       point: every request arriving on :80 is plain and gets rejected. TLS does not
       need to be requested for the secure side either — Traefik requires TLS on a
       TLS entrypoint on its own and takes the certificate from spec.tls below.
       Serving HTTP instead of bouncing it to HTTPS is also a deliberate choice:
       a redirect is a Traefik middleware (IngressRoute) or an entrypoint-level
       redirection in the static config, and the latter would change behaviour for
       every other host on this shared cluster. */}}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.entrypoints" "web,websecure" -}}
{{- else }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.entrypoints" "web" -}}
{{- end }}
{{- end }}
{{- range $key, $value := .Values.ingress.annotations }}
{{- $_ := set $annotations $key $value -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dogit.fullname" . }}
  labels:
    {{- include "dogit.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
        {{- range .Values.ingress.additionalHosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ printf "%s-tls" (include "dogit.fullname" .) | trunc 63 | trimSuffix "-" }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dogit.fullname" . }}-web
                port:
                  name: http
    {{- range .Values.ingress.additionalHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dogit.fullname" $ }}-web
                port:
                  name: http
    {{- end }}
{{- end }}
