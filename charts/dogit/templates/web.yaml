apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dogit.fullname" . }}-web-nginx
  labels:
    {{- include "dogit.labels" . | nindent 4 }}
data:
  default.conf: |
    # One origin for the SPA and API keeps cookie sessions same-site.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
      }

      location /api/ {
        proxy_pass http://{{ include "dogit.fullname" . }}-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        client_max_body_size 8m;
        proxy_read_timeout 300s;
      }

      location = /-/health {
        proxy_pass http://{{ include "dogit.fullname" . }}-app:8080/-/health;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      }

      location = /-/ready {
        proxy_pass http://{{ include "dogit.fullname" . }}-app:8080/-/ready;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }

      gzip on;
      gzip_types text/plain text/css application/javascript application/json image/svg+xml;
      gzip_min_length 1024;
    }

    # This directory is shared with the route-generator sidecar and may be empty.
    include /etc/nginx/dogit-modules/*.conf;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dogit.fullname" . }}-web
  labels:
    {{- include "dogit.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "dogit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "dogit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ printf "%s:%s" .Values.image.web.repository .Values.image.web.tag | quote }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: module-routes
              mountPath: /etc/nginx/dogit-modules
        - name: route-generator
          image: {{ printf "%s:%s" .Values.image.app.repository .Values.image.app.tag | quote }}
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          command:
            - dogit
            - module
            - routes
            - --nginx
            - --watch
            - --output
            - /etc/nginx/dogit-modules/modules.conf
          env:
            - name: DOGIT_ENV
              value: {{ .Values.app.environment | quote }}
            - name: DOGIT_LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: DOGIT_PUBLIC_HOST
              value: {{ include "dogit.publicHost" . | quote }}
            {{- include "dogit.databaseEnv" . | nindent 12 }}
          volumeMounts:
            - name: module-routes
              mountPath: /etc/nginx/dogit-modules
      volumes:
        - name: nginx
          configMap:
            name: {{ include "dogit.fullname" . }}-web-nginx
        - name: module-routes
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dogit.fullname" . }}-web
  labels:
    {{- include "dogit.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "dogit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
