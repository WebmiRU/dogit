# nginx configuration for the dogit SPA.
#
# Two responsibilities: serve the built single-page app, and proxy /api to the Go
# service. Serving the app and the API from one origin is what lets the session
# cookie work without CORS and without any cross-site allowances.

# The Docker embedded DNS, used to re-resolve the application.
#
# The address is put in a variable on purpose: nginx resolves an "upstream server"
# name once, at start-up. When the application container is recreated it usually
# gets a different IP, and nginx would keep talking to the old one and answer 502
# until it was restarted. Using a variable forces a lookup per request (cached by
# "valid"), so a moved container is picked up within seconds.
resolver 127.0.0.11 valid=10s ipv6=off;

# Configuration for the modules that asked to be reachable: the registry and
# anything like it, served on their own names on the same ports as the site.
#
# It is written by "dogit module routes --watch" and included rather than part of
# this file, so installing a module is not a change to the web image. The include
# of a directory that may not exist is the one wildcard: a missing directory here
# would otherwise stop the proxy from starting at all.
include /etc/nginx/dogit-modules/*.conf;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded assets are content-hashed by the build, so they can be cached
    # indefinitely. index.html must never be cached, or a deploy would keep
    # serving the previous bundle.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        set $dogit_api http://app:8080;
        proxy_pass $dogit_api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API answers with JSON, so there is nothing to compress beyond
        # ordinary text; the buffer is raised for large repository listings.
        proxy_buffering off;
        client_max_body_size 8m;
        proxy_read_timeout 300s;
    }

    # Health probes for the API, reachable without going through the SPA.
    location = /-/health {
        set $dogit_api http://app:8080;
        proxy_pass $dogit_api/-/health;
    }

    location = /-/ready {
        set $dogit_api http://app:8080;
        proxy_pass $dogit_api/-/ready;
    }

    # Client-side routing: unknown paths return the SPA shell, which then renders
    # the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
