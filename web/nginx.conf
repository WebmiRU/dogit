# nginx configuration for the dogit SPA.
#
# Two responsibilities: serve the built single-page app, and proxy /api to the Go
# service. Serving the app and the API from one origin is what lets the session
# cookie work without CORS and without any cross-site allowances.

upstream dogit_api {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded assets are content-hashed by the build, so they can be cached
    # indefinitely. index.html must never be cached, or a deploy would keep
    # serving the previous bundle.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://dogit_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API answers with JSON, so there is nothing to compress beyond
        # ordinary text; the buffer is raised for large repository listings.
        proxy_buffering off;
        client_max_body_size 8m;
        proxy_read_timeout 300s;
    }

    # Health probes for the API, reachable without going through the SPA.
    location = /-/health {
        proxy_pass http://dogit_api/-/health;
    }

    location = /-/ready {
        proxy_pass http://dogit_api/-/ready;
    }

    # Client-side routing: unknown paths return the SPA shell, which then renders
    # the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
