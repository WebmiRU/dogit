name: Go tests

on:
  push:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - ".github/workflows/go-tests.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - ".github/workflows/go-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dogit
          POSTGRES_PASSWORD: dogit
          POSTGRES_DB: dogit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dogit -d dogit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Create the Docker network used by runner tests
        run: docker network inspect dogit_default >/dev/null 2>&1 || docker network create dogit_default
      - name: Test all packages with a fresh database per package
        run: bash ./scripts/test-fresh-db.sh
