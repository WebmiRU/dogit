# The build cache, on a volume rather than in the pod.
#
# NOT APPLIED by default, and deliberately so. This project works to a rule of no host
# filesystem paths, and on k3s a `local-path` claim is a host directory — a dedicated one the
# container cannot see past, but a hostPath all the same. `buildkit.yaml` therefore mounts an
# emptyDir and this file is what to apply when that trade is worth revisiting:
#
#     kubectl apply -f pvc.yaml
#     # then put the volume in buildkit.yaml back to
#     #   - name: state
#     #     persistentVolumeClaim:
#     #       claimName: buildkit-state
#     # and delete the emptyDir that has the same name
#
# What it buys: the cache survives a rollout, an eviction and a move to another node. What it
# costs on k3s: a host path, and a volume pinned to one node besides.
#
# On a cluster with a network storage driver this file is worth revisiting on its own
# merits — there it is not a host path at all. The driver matters: a block device with ext4
# or xfs on top suits BuildKit's state better than a network filesystem, because BuildKit
# renames and sets permissions constantly, and a ReadWriteOnce claim is pinned to one node
# by most drivers, which is the same limitation wearing a different name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-state
  namespace: buildkit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
