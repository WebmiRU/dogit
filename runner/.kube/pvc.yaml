# The build cache, on a disk rather than in the pod.
#
# The cache is the reason for this volume at all: without it every pod restart is a cold
# build, and a runner that re-pulls its base images on each deploy is a runner whose builds
# are slow for a reason nobody can see. Size is a judgement — jabjab had 44 GB free when this
# was written, and BuildKit is the only thing here that grows.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-state
  namespace: buildkit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
