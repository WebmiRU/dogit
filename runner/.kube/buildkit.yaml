# The builder, as the image its authors publish for exactly this case.
#
# `moby/buildkit:rootless` rather than the plain one: the plain image needs a privileged
# container, and the whole point of running it as a pod instead of on the node is that it
# does not. The image runs as uid 1000 and ships its own subuid/subgid range, so nothing
# about it has to be prepared on the node first.
#
# --oci-worker-no-process-sandbox is the flag that makes this work under Kubernetes, and the
# cost is stated plainly by BuildKit's own documentation: it cannot kill a process that
# refuses to exit, and it lets an ExecOp container kill — and potentially ptrace — arbitrary
# processes in the daemon's container. The alternative the Docker instructions use,
# `systempaths=unconfined`, has no Kubernetes equivalent. Given that the alternative is a
# privileged container, this trade is the right way round; it is also the one BuildKit's own
# Kubernetes examples make.
#
# The snapshotter is left to BuildKit to choose. On this kernel it should pick overlayfs,
# which is the fast one; if nested overlayfs turns out not to work here, the fallbacks are
# fuse-overlayfs (needs /dev/fuse, which the node has) and native (slower, always works).
# Read it out of the pod's own log rather than guessing which one it took.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkit
  namespace: buildkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkit
  template:
    metadata:
      labels:
        app: buildkit
    spec:
      # BuildKit has no business talking to the Kubernetes API. It is handed other people's
      # Dockerfiles and asked to run their RUN steps, and a ServiceAccount token in that
      # position is a way out of the namespace.
      automountServiceAccountToken: false

      securityContext:
        # Already the image's own user, said here as well so that this file answers the
        # question on its own rather than sending the reader to an image manifest.
        runAsUser: 1000
        runAsGroup: 1000
        # The volume has to be writable by 1000, and fsGroup is the only thing that says so.
        fsGroup: 1000

      containers:
        - name: buildkitd
          image: moby/buildkit:rootless
          # Appended to the image's entrypoint, which is already `rootlesskit buildkitd`.
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            # TLS in both directions, and the reason is in the README: without it, every
            # executor container — that is, every RUN step of every Dockerfile that passes
            # through here — can call the BuildKit API itself.
            - --tlscacert
            - /certs/ca.pem
            - --tlscert
            - /certs/tls.crt
            - --tlskey
            - /certs/tls.key

          securityContext:
            # rootlesskit needs unshare() and mount(), which the default seccomp profile
            # refuses. Unconfined rather than privileged: this is the narrowest door that
            # opens, and it is the one BuildKit documents for this image.
            seccompProfile:
              type: Unconfined

          ports:
            - name: grpc
              containerPort: 1234

          volumeMounts:
            - name: state
              mountPath: /home/user/.local/share/buildkit
            - name: certs
              mountPath: /certs
              readOnly: true

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            # A ceiling rather than a reservation, because the node has 4 GB shared with
            # Traefik and the deployed workloads, and a builder that takes the node down with
            # it takes the queue-draining with it.
            limits:
              cpu: "2"
              memory: 2Gi

          livenessProbe:
            # A plain TCP check, deliberately. buildkitd answers gRPC and wants a client
            # certificate; a probe that has to present one is a probe that will fail for
            # reasons having nothing to do with whether the daemon is alive. "Is something
            # listening" is the question worth asking from here.
            tcpSocket:
              port: 1234
            initialDelaySeconds: 20
            periodSeconds: 30

      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: buildkit-state
        - name: certs
          secret:
            secretName: buildkit-certs
            # The keys are already uid 1000 in the Secret, and BuildKit reads them as the
            # user it runs as, so there is nothing to make readable here that is not already.
            defaultMode: 0400
