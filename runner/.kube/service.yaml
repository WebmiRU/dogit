# How a client gets to the builder.
#
# A Service and nothing else, deliberately: no Ingress. The gRPC API is not something to put
# behind a hostname on the internet, and the only client that will ever use it is the runner
# two namespaces over.
#
# The name here is the name in the server certificate's subjectAltName, which is why the
# certificates are made for `buildkit.buildkit.svc` and not for an IP — a Service gets a new
# cluster IP every time it is recreated, and a certificate that pins an IP stops matching on
# the day somebody deletes the Service.
apiVersion: v1
kind: Service
metadata:
  name: buildkit
  namespace: buildkit
  labels:
    app: buildkit
spec:
  selector:
    app: buildkit
  ports:
    - name: grpc
      port: 1234
      targetPort: 1234
