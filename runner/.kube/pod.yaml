# The builder and the runner, in one pod.
#
# One pod rather than two, which is the opposite of what was recommended before it was tried
# and the recommendation is worth stating so it can be argued with later. Two things came out
# of the measuring: a builder that peaked at 2 GB next to Traefik and the deployed workloads
# is no longer a risk with `--oci-max-parallelism=2`, and there is nothing to scale yet. What
# is bought is smaller: no Service, no cross-pod network rule, and a client certificate
# delivered as a file rather than across a network.
#
# What is NOT bought is safety on loopback, and that is the one thing worth being careful
# about. Rootless BuildKit runs every executor container in the daemon's own network
# namespace — that is what `network.host` means in the log line it prints. So `127.0.0.1:1234`
# is reachable from a `RUN` step exactly as it is from the runner, and a Dockerfile is
# somebody else's code. Hence mTLS: the runner holds a client certificate, and a `RUN` step
# holding nothing gets a 401 from an API that otherwise would let it drive the builder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkit
  namespace: buildkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkit
  template:
    metadata:
      labels:
        app: buildkit
    spec:
      # Neither container has any business calling the Kubernetes API. The runner will need
      # to, later, to put a job in a pod — and when it does it will get a ServiceAccount of
      # its own with permissions for one namespace, rather than a pod-wide default token that
      # would also be sitting next to the builder.
      automountServiceAccountToken: false

      # So that the client certificate is readable by both containers without making it
      # world-readable. uid 1000, because that is what both images run as.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: buildkitd
          image: moby/buildkit:rootless
          # Both tags in this pod move, and a tag is a promise rather than an address.
          # Without this the default for a non-":latest" tag is IfNotPresent, the node
          # answers from its own store, and a freshly pushed image is deployed to nowhere
          # while the pod reports itself ready and the panel fills in from old code. Found
          # the hard way, and it is the same trap the stand's own deploy script was changed
          # to close: a rollout that says it succeeded is not a statement about the code.
          imagePullPolicy: Always
          # Appended to the image's entrypoint, which is already `rootlesskit buildkitd`.
          args:
            - --addr
            - tcp://0.0.0.0:1234
            # Kubernetes has no equivalent of Docker's `systempaths=unconfined`, and without
            # this an unprivileged build does not run. The cost is stated by BuildKit itself
            # and left visible in its log: the daemon cannot kill a process that refuses to
            # exit, and an ExecOp container can kill — and possibly ptrace — processes in the
            # daemon's container. The alternative to the flag is a privileged container, which
            # gives up the reason for running a builder as a pod at all.
            - --oci-worker-no-process-sandbox
            # Two at a time because the node has 4 GB to share with Traefik and with whatever
            # it is building, and an executor is one build step's worth of memory at whatever
            # that step needs. Without a ceiling, one busy pipeline is a decision the node
            # makes on its own, and it makes it by OOMKilling something.
            #
            # The name is `--oci-max-parallelism`, not `--oci-worker-max-parallelism`; the
            # latter costs one restart to learn, because BuildKit answers an unknown flag by
            # printing its whole help text and exiting 1, which reads as a crash.
            - --oci-max-parallelism=2
            - --tlscacert
            - /certs/ca.pem
            - --tlscert
            - /certs/tls.crt
            - --tlskey
            - /certs/tls.key

          securityContext:
            # rootlesskit needs unshare() and mount(), which the default seccomp profile
            # refuses. Unconfined, not privileged: the narrowest door that opens, and the one
            # BuildKit documents for this image.
            seccompProfile:
              type: Unconfined

          ports:
            - name: grpc
              containerPort: 1234

          volumeMounts:
            # An emptyDir rather than a claim. The image declares a volume at this path, so a
            # mount exists either way; this one is just anonymous. The cost is the cache,
            # and the cost is paid when the pod is recreated rather than when the container
            # restarts — an emptyDir survives the first and dies with the second, and this is
            # a Deployment, so it dies on every rollout and on every eviction. `pvc.yaml`
            # says what to change when that is worth trading back.
            - name: state
              mountPath: /home/user/.local/share/buildkit
            - name: certs
              mountPath: /certs
              readOnly: true

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            # A ceiling, not a reservation: the node is shared, and a builder that takes the
            # node down with it takes the queue-draining with it.
            limits:
              cpu: "2"
              memory: 2Gi

          livenessProbe:
            # A plain TCP check, deliberately. buildkitd answers gRPC and wants a client
            # certificate, and a probe that has to present one fails for reasons having
            # nothing to do with whether the daemon is alive. From in here it can use the
            # local socket instead — but "is something listening" is the question worth
            # asking, and the build probe belongs on the runner, which is the thing whose
            # brokenness a person would be annoyed by.
            tcpSocket:
              port: 1234
            initialDelaySeconds: 20
            periodSeconds: 30

        - name: runner
          image: yudole/runner:dev
          imagePullPolicy: Always
          args:
            # Loopback, because the two containers share this pod's network namespace.
            - --buildkit=tcp://127.0.0.1:1234
            - --core=https://f220.ru
            # The address the core will record. It cannot be loopback — the core is in
            # another cluster — and it does not have to work today: everything a runner does
            # in this first increment travels runner to core, not the other way.
            - --endpoint=http://139.100.221.43:8092
            - --name=buildkit
          env:
            # The instance's token, which is the only credential that can register a module.
            # Kept as a variable and not a flag so that it does not land in the process list,
            # where anything in the pod can read it.
            - name: DOGIT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runner-registry
                  key: token
            - name: DOGIT_BUILDKIT_CA
              value: /certs/ca.pem
            - name: DOGIT_BUILDKIT_CERT
              value: /certs/client.crt
            - name: DOGIT_BUILDKIT_KEY
              value: /certs/client.key
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            # The workspace, so that the panel's Storage box has something to measure. An
            # emptyDir for now, and not because it is right: once a job runs in a pod of its
            # own, the checkout has to be visible to both, and an emptyDir is visible to
            # neither. That is the change that a shared volume is for, and it is the next
            # thing the executor brings.
            - name: workspace
              mountPath: /data/work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: state
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: certs
          secret:
            secretName: buildkit-certs
            # Group-readable, because both containers run as gid 1000 and the Secret's files
            # belong to root. 0400 would be tidier and would work for neither of them.
            defaultMode: 0440
