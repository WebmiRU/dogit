# BuildKit's own namespace, separate from the runner's.
#
# Separate because the two have genuinely different permissions and the runner will not have
# this many. The runner needs a Kubernetes token to put a job in a pod; buildkitd needs no
# Kubernetes access at all, and it spends its time executing other people's Dockerfiles. So
# buildkitd runs with automountServiceAccountToken off, and if that separation ever breaks the
# broken one is visible in one line of this file rather than in an incident.
apiVersion: v1
kind: Namespace
metadata:
  name: buildkit
  labels:
    app.kubernetes.io/part-of: runner
