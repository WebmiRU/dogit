# The web tier: the single-page application, served by nginx, and the same nginx
# answering the API so that the page and the data come from one origin.
#
# In front of it there is nothing: f220.ru is answered by the cluster's own ingress,
# which terminates TLS and forwards to the service below. That is the same job the
# nginx container does in the compose stack, one layer out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dogit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: yudole/dogit:dev-web
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          volumeMounts:
            # The site's own configuration, with the cluster's DNS address put into it.
            # Written by deploy.sh rather than baked into the image, because the address
            # is the cluster's to give and not this repository's to guess.
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # The directory the modules' own server blocks are included from. Empty, and
            # mounted so it exists: nginx refuses to start over an include whose directory
            # is not there, and that is the one wildcard this configuration relies on.
            - name: module-routes
              mountPath: /etc/nginx/dogit-modules
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
      volumes:
        - name: nginx
          configMap:
            name: web-nginx
        - name: module-routes
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dogit
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The site itself, on the domain the cluster is reached by.
#
# The certificate is not named here on purpose: the ingress issues and renews it through
# the cluster's own ACME account, and naming a secret would tell it the certificate is
# already there — which is a certificate nobody will renew.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dogit
  namespace: dogit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: f220.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
