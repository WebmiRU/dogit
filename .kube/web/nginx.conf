# nginx configuration for the dogit SPA, on Kubernetes.
#
# This is web/nginx.conf with one line changed, and the change is the whole of the
# difference between a container network and a cluster one. Everything else — one origin
# for the site and the API, the websocket upgrade, the module include — is the same
# problem solved the same way.
#
# Serving the app and the API from one origin is what lets the session cookie work
# without CORS and without any cross-site allowances.

# The cluster's DNS, so a name is re-resolved rather than pinned once.
#
# The address is put in a variable on purpose: nginx resolves an "upstream server"
# name once, at start-up. When the application pod is recreated it usually
# gets a different IP, and nginx would keep talking to the old one and answer 502
# until it was restarted. Using a variable forces a lookup per request (cached by
# "valid"), so a moved pod is picked up within seconds.
#
# __KUBE_DNS__ is replaced when this file is applied: deploy.sh reads the cluster's own
# address for kube-dns rather than this file guessing one, because the address a cluster
# hands out is not a constant of the world.
#
# __DOGIT_NS__ is replaced the same way, for the namespace this stand runs in.
resolver __KUBE_DNS__ valid=10s ipv6=off;

# The application is named in full, "app.<namespace>.svc.cluster.local", and it has to be.
#
# A pod's own resolver would be happy with "app": the search list in /etc/resolv.conf turns
# it into "app.<namespace>.svc.cluster.local" before anything is sent. This resolver is not
# the pod's resolver. It is the address above, and nginx builds the query itself — it does
# not walk a search list, so the bare name is sent as "app." and CoreDNS, which only knows
# names inside the cluster's domain, answers "no such host". Every proxied request is a 502
# and the log says "app could not be resolved", which reads like CoreDNS is down rather
# than like the name was half a name.
resolver_timeout 5s;

# The one connection on this site that is not an ordinary request.
#
# The event socket is a WebSocket, and a WebSocket is an ordinary GET until it says
# otherwise: nginx proxies it as ordinary HTTP without these two headers, the upgrade is
# dropped on the way to the application, and the socket is refused with "Connection header
# does not contain Upgrade". Nothing on the page says so — the browser logs it, the page
# carries on, and every list that is drawn from events quietly stops updating: a deployment
# log that does not stream, a status that does not change, a page somebody reloads to find
# out what happened.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded assets are content-hashed by the build, so they can be cached
    # indefinitely. index.html must never be cached, or a deploy would keep
    # serving the previous bundle.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        set $dogit_api http://app.__DOGIT_NS__.svc.cluster.local:8080;
        proxy_pass $dogit_api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The upgrade, carried through: "upgrade" when the client asked for one, "close"
        # when it did not — which is what this header means in both cases and what the
        # application checks before it refuses the socket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The API answers with JSON, so there is nothing to compress beyond
        # ordinary text; the buffer is raised for large repository listings.
        proxy_buffering off;
        client_max_body_size 8m;
        proxy_read_timeout 300s;
    }

    # Health probes for the API, reachable without going through the SPA.
    location = /-/health {
        set $dogit_api http://app.__DOGIT_NS__.svc.cluster.local:8080;
        proxy_pass $dogit_api/-/health;
    }

    location = /-/ready {
        set $dogit_api http://app.__DOGIT_NS__.svc.cluster.local:8080;
        proxy_pass $dogit_api/-/ready;
    }

    # Client-side routing: unknown paths return the SPA shell, which then renders
    # the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Configuration for the modules that asked to be reachable: the registry and
# anything like it, served on their own names on the same ports as the site.
#
# It is written by "dogit module routes --watch" and included rather than part of
# this file, so installing a module is not a change to the web image. The include
# of a directory that may not exist is the one wildcard: a missing directory here
# would otherwise stop the proxy from starting at all.
#
# The directory is an emptyDir mounted over it, so it exists and holds nothing:
# nothing on this stand needs a module to be reachable under the site's own name.
# The registry is published on an address of its own (see 30-registry.yaml), which
# is the cheaper way to reach a module and the one a docker client can be pointed
# at without a name that resolves.
include /etc/nginx/dogit-modules/*.conf;
