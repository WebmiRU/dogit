# The registry, and the authorisation proxy in front of it.
#
# Two deployments because they are two things. The proxy decides who may push what and
# needs nothing but the core; the registry stores bytes and knows nothing about anybody.
# Splitting them is what lets the proxy be restarted or replaced without touching the
# images, and the images survive the proxy being down.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: dogit
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: dogit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: registry
              containerPort: 5000
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: dogit
spec:
  selector:
    app: registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-registry
  namespace: dogit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: module-registry
  template:
    metadata:
      labels:
        app: module-registry
    spec:
      containers:
        - name: module-registry
          image: yudole/dogit:dev-app
          imagePullPolicy: Always
          command: ["module-registry"]
          env:
            - name: DOGIT_CORE_URL
              value: http://app:8080
            - name: DOGIT_MODULE_ENDPOINT
              value: http://module-registry:8091
            # This module's own token, which it also authenticates every request with — see
            # module-runner.yaml. Minted with:
            #   kubectl -n dogit exec deploy/app -- dogit module token create --name registry
            # and kept in a Secret rather than written here, because it is a credential and
            # this file is meant to be readable.
            - name: DOGIT_MODULE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dogit-token-registry
                  key: token
            # The address a docker client uses, and the address image names are built
            # with — one setting, written once at registration, because a cluster that
            # cannot pull what a build pushed is a rollout that sits at ImagePullBackOff.
            #
            # A name under this site's own domain, on the same 443 everything else is
            # on, rather than an address and a port of its own. Three things fall out of
            # that: the name in an image is something a person can read, the certificate
            # is one this cluster already has a way to get, and a cluster pulling from it
            # needs nothing arranged first — an ordinary HTTPS registry is trusted the way
            # Docker Hub is, where a plain-HTTP one on port 30500 had to be declared
            # insecure on every node that pulled from it.
            - name: DOGIT_MODULE_PUBLIC_URL
              value: https://registry.f220.ru
            - name: DOGIT_REGISTRY_PUBLIC_ADDRESS
              value: https://registry.f220.ru
            # The project's own page reads images from this module, so the module has to
            # answer a browser on the instance's address.
            - name: DOGIT_MODULE_ALLOWED_ORIGINS
              value: https://f220.ru
            - name: DOGIT_MODULE_LISTEN
              value: ":8091"
            - name: REGISTRY_URL
              value: http://registry:5000
            - name: REGISTRY_STORAGE_DIR
              value: /var/lib/registry
          ports:
            - name: http
              containerPort: 8091
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          volumeMounts:
            # Read-only: the proxy reads what the registry stored and writes nothing
            # here, and a module that can write the image store can replace it.
            - name: data
              mountPath: /var/lib/registry
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: module-registry
  namespace: dogit
spec:
  selector:
    app: module-registry
  ports:
    - name: http
      port: 8091
      targetPort: http
---
# The same module, published on the node on 30500.
#
# LoadBalancer rather than NodePort because the port is not in the NodePort range and
# because this cluster's load balancer is already the thing that publishes 80, 443 and
# 2222. It is the address built into image names, and the address the cluster pulls from.
apiVersion: v1
kind: Service
metadata:
  name: module-registry-public
  namespace: dogit
spec:
  type: LoadBalancer
  selector:
    app: module-registry
  ports:
    - name: http
      port: 30500
      targetPort: http
---
# The registry on a name, through the ingress.
#
# This is what makes "registry.f220.ru" work for a docker client, and it is a route
# rather than a LoadBalancer: the port is 443, which the cluster's ingress already holds,
# and the name already has a DNS record and a certificate this cluster can get by itself.
#
# The service above stays, because a stand that has to fall back to "the node's address
# and a port" should still have one that works — but nothing builds image names from it
# any more, and nothing pulls from it either.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: dogit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: registry.f220.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: module-registry
                port:
                  number: 8091
