# The receiving end on jabjab.ru: what the test cluster answers on the internet.
#
# This cluster deploys *into*, it does not run dogit. It exists to receive a workload
# built and pushed on the f220 stand and to be reached on a real name over real TLS,
# which is the part a test cluster cannot be trusted on without: a rollout that lands
# and answers nothing proves nothing.
#
# The certificate is not named here on purpose — the ingress gets it from the cluster's
# own ACME account through the certresolver, and naming a Secret would say the
# certificate is already there, which is a certificate nobody will renew.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jabjab
  namespace: versions-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: jabjab.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jabjab-site
                port:
                  number: 80
    - host: www.jabjab.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jabjab-site
                port:
                  number: 80
    # versions.jabjab.ru is deliberately NOT here. It is the deployed workload's own name,
    # and it is routed by the ingress the deployment applies (k8s/ingress.yaml in the test
    # repository). Two ingresses claiming one host is not a merge: Traefik takes one of
    # them, and which one is not something anybody should have to guess — the symptom is a
    # placeholder page sitting on the address of a thing that was deployed two minutes ago.
---
# Something for those three names to point at.
#
# A page that says what this is and where it came from, which is the only thing a person
# opening the name needs: this is the receiving cluster, the deployment target, and the
# image it is running is named on it. A deployment module watching a rollout wants a pod
# that answers on /, and this answers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jabjab-site
  namespace: versions-dev
spec:
  replicas: 1
  strategy:
    # One at a time, like everything else here: this cluster has one CPU, and two old
    # pods plus two new ones is a rollout that cannot be told from one that is stuck.
    type: Recreate
  selector:
    matchLabels:
      app: jabjab-site
  template:
    metadata:
      labels:
        app: jabjab-site
    spec:
      containers:
        - name: site
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: html
          configMap:
            name: jabjab-site
            defaultMode: 0o444
---
apiVersion: v1
kind: Service
metadata:
  name: jabjab-site
  namespace: versions-dev
spec:
  selector:
    app: jabjab-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jabjab-site
  namespace: versions-dev
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head><meta charset="utf-8"><title>jabjab.ru — приёмник деплоя</title></head>
    <body style="font-family:system-ui,sans-serif;max-width:44rem;margin:4rem auto;padding:0 1.5rem;line-height:1.6">
      <h1>jabjab.ru</h1>
      <p>Это тестовый кластер k3s — <b>приёмник деплоя</b>. Здесь разворачивается то,
      что собирается и пушится в реестр на стенде <code>f220.ru</code>.</p>
      <p>Собственного реестра здесь нет и не нужно: образы тянутся с
      <code>registry.f220.ru</code> как с обычного публичного HTTPS-реестра.</p>
      <h2>Имена на этом кластере</h2>
      <ul>
        <li><a href="https://jabjab.ru/">jabjab.ru</a> — эта страница</li>
        <li><a href="https://versions.jabjab.ru/">versions.jabjab.ru</a> — под тестовый деплой <code>versions</code></li>
      </ul>
      <p>Сертификат — Let's Encrypt, выпущен кластером через ACME, обновляется сам.</p>
    </body>
    </html>