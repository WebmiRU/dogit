# The namespace the whole stand lives in.
#
# Its own file, applied first, and that is the whole point of it being its own file: the
# site's configuration is rendered into a ConfigMap in this namespace before anything else
# is applied, so a namespace created as a side effect of applying the database — which is
# what this used to be, a header on postgres/postgres.yaml — arrives one step too late.
apiVersion: v1
kind: Namespace
metadata:
  name: dogit
  labels:
    app.kubernetes.io/part-of: dogit