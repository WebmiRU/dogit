# The ingress on jabjab.ru, which is the receiving cluster: workloads built on the f220
# stand land here, and this is what they are reached through.
#
# The same shape as f220-values.yaml and for the same reason — see that file. Traefik here
# is a HelmChart resource too, so a hand-applied change to the Deployment does not survive
# a restart of k3s.
#
# Two things differ on purpose. The contact is jabjab's own, because a certificate is
# about the name it is issued for and the address that has to hear about it. And there is no
# registry here: this cluster receives images from registry.f220.ru over ordinary HTTPS,
# which is why it needs nothing to be arranged before it can pull one.
additionalArguments:
  - --entryPoints.web.http.redirections.entryPoint.to=websecure
  - --entryPoints.web.http.redirections.entryPoint.scheme=https
  - --entryPoints.web.http.redirections.entryPoint.permanent=true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@jabjab.ru
      storage: /data/acme.json
      tlsChallenge: true

persistence:
  enabled: true
  size: 128Mi

ports:
  websecure:
    # 8443 inside, 443 outside — see f220-values.yaml.
    port: 8443
    targetPort: 8443
    http3:
      enabled: true
      advertisedPort: 443