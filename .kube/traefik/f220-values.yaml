# The ingress on f220.ru: HTTPS, a certificate from Let's Encrypt, and the plain-HTTP
# port answering with a redirect rather than a page.
#
# Declared as the values of the cluster's own HelmChart, which is the point of this file.
# Traefik here is installed through a HelmChart resource, and k3s's helm-controller
# re-installs it from those values on every restart of k3s. Anything applied to the running
# Deployment instead — a `kubectl patch`, a hand-edited container arg — is gone at the next
# restart, and it is gone silently: the pod comes back, the service comes up, and what is
# missing is a certificate nobody asked about again until a browser said the name was not
# secure. That is not a hypothetical; it is what happened to this cluster once already.
#
# Apply with deploy.sh, which puts these values on the HelmChart and waits for the
# certificate rather than assuming one.
#
# The certificate is TLS-ALPN, not HTTP. The challenge answers on 443 and the redirect on
# 80 is about every other request; a challenge that had to come in over plain HTTP would be
# standing in the same doorway.
additionalArguments:
  # Plain HTTP answers with a permanent redirect and nothing else.
  - --entryPoints.web.http.redirections.entryPoint.to=websecure
  - --entryPoints.web.http.redirections.entryPoint.scheme=https
  - --entryPoints.web.http.redirections.entryPoint.permanent=true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@f220.ru
      # On the persistent volume, so a certificate survives the pod. Without it every
      # restart is a new certificate, and Let's Encrypt's rate limit is a hard wall: five
      # duplicate certificates a week for this name.
      storage: /data/acme.json
      tlsChallenge: true

persistence:
  enabled: true
  size: 128Mi

ports:
  websecure:
    # 8443 inside the pod, because this cluster publishes 443 through svclb by binding it
    # on the node, and a Traefik that also listened on 443 would collide with it — the
    # port goes quiet on the node while the pod reports itself healthy, which looks like a
    # network problem and is not one.
    port: 8443
    targetPort: 8443
    http3:
      enabled: true
      # What the server tells a browser to use, which is 443 — the port the world sees.
      # Left to itself the chart advertises the port from inside the pod, so every browser
      # is told to come back to :8443, which is not published anywhere.
      advertisedPort: 443