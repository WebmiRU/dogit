# The deployment module: it applies manifests to a cluster and watches the rollout.
#
# Its own state is the credentials for the database the core handed it once, at
# registration, and never again — the core does not store a password. Keeping them here is
# the only way the history survives a restart, and a history that is empty after every
# restart is a history that cannot answer the one question anybody opens it for.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: module-deploy-state
  namespace: dogit
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-deploy-kubernetes
  namespace: dogit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: module-deploy-kubernetes
  template:
    metadata:
      labels:
        app: module-deploy-kubernetes
    spec:
      containers:
        - name: module-deploy-kubernetes
          image: yudole/dogit:dev-app
          imagePullPolicy: Always
          command: ["module-deploy-kubernetes"]
          env:
            - name: DOGIT_CORE_URL
              value: http://app:8080
            - name: DOGIT_MODULE_ENDPOINT
              value: http://module-deploy-kubernetes:8094
            # This module's own token, not a shared one — see module-runner.yaml.
            - name: DOGIT_MODULE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dogit-token-deploy
                  key: token
            - name: DOGIT_MODULE_NAME
              value: kubernetes
          ports:
            - name: http
              containerPort: 8094
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          volumeMounts:
            - name: state
              mountPath: /var/lib/dogit-deploy
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: module-deploy-state
---
apiVersion: v1
kind: Service
metadata:
  name: module-deploy-kubernetes
  namespace: dogit
spec:
  selector:
    app: module-deploy-kubernetes
  ports:
    - name: http
      port: 8094
      targetPort: http
