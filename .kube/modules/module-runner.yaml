# The runner module: the thing that actually builds images.
#
# It lives in the cluster rather than beside the core on purpose — a runner is a machine
# with a usable Docker, and this node has one. Two things it needs are the node's, not the
# cluster's, and both are said here rather than left to be discovered:
#
#   * the Docker socket, because the containers it runs are created by the node's daemon
#   * the workspace, which has to be the same directory on the node as it is here
#
# The second is the one that bites. The daemon resolves a path on the node, so a volume
# mounted anywhere else is a checkout one level out of reach, and the job fails at
# "test -f k8s/Dockerfile" with a log that says nothing about a directory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-runner
  namespace: dogit
spec:
  replicas: 1
  # Two runners would take the same workspace and the same Docker daemon and fight over
  # both. One node, one runner.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: module-runner
  template:
    metadata:
      labels:
        app: module-runner
    spec:
      # Root, and this is not a shortcut. A container holding the Docker socket is
      # already root on the node whatever its user is, so the user buys nothing; what it
      # does buy is an inability to read the socket and a build that fails on a permission
      # rather than on a missing thing.
      securityContext:
        runAsUser: 0
      containers:
        - name: module-runner
          image: yudole/dogit:dev-app
          imagePullPolicy: Always
          command: ["module-runner"]
          env:
            - name: DOGIT_CORE_URL
              value: http://app:8080
            - name: DOGIT_MODULE_ENDPOINT
              value: http://module-runner:8092
            # See registry/registry.yaml: the registration token lives in the Secret
            # "dogit-module-token" in this namespace, not in this file.
            - name: DOGIT_MODULE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dogit-module-token
                  key: token
            # One job at a time: the node has a single CPU, and a build that competes
            # with a rollout for it is a rollout that times out for a reason nobody can
            # see from the cluster.
            - name: DOGIT_RUNNER_CONCURRENCY
              value: "1"
            - name: DOGIT_RUNNER_WORKSPACE
              value: /data/work
            # The daemon is the node's, so a path in "docker run -v" means a path on the
            # node — and the two halves have to line up. This runner clones into
            # /data/work, which on the node is /var/lib/dogit-work/work, so that is the
            # source. The mount is where that appears in the job's own container, and it
            # has to be the same /data this runner sees.
            #
            # Saying /var/lib/dogit-work here instead is the mistake worth naming: the
            # checkout then lands at /data/work in the job against a copy that is really
            # at /data/work/work, the working directory holds nothing, and the build dies
            # on its first line — "test -f k8s/Dockerfile" — with a log that says only
            # that, and no mention of a path.
            - name: DOGIT_RUNNER_WORKSPACE_VOLUME
              value: /var/lib/dogit-work
            - name: DOGIT_RUNNER_WORKSPACE_MOUNT
              value: /data
            - name: DOGIT_DOCKER_BINARY
              value: /usr/bin/docker
            # A job's container is put on the Docker network "dogit_default", which is the
            # name the compose stack gives its own network. It is created on the node by
            # deploy.sh, before this pod: without it every build dies on its first line with
            # "failed to set up container networking: network dogit_default not found", and
            # the log says nothing about the checkout, the Dockerfile, or anything else that
            # was actually being attempted.
            #
            # The name cannot be changed from here: the runner builds the network name from
            # the name the compose stack uses, and reads an override only out of a job's own
            # variables, not out of this module's environment.
          ports:
            - name: http
              containerPort: 8092
          resources:
            requests: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            # Mounted at /run rather than /var/run: inside the image /var/run is a
            # symlink to ../run, and a socket mounted through it lands somewhere the
            # process never looks.
            - name: docker-socket
              mountPath: /run/docker.sock
            - name: work
              mountPath: /data
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: work
          hostPath:
            path: /var/lib/dogit-work
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: module-runner
  namespace: dogit
spec:
  selector:
    app: module-runner
  ports:
    - name: http
      port: 8092
      targetPort: http
