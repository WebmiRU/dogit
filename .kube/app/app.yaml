# The application: the web and API server, and the SSH front end that git pushes arrive
# through. Both come from one image and one process tree, because a push is a write and a
# web page is a read of the same state and there is nothing in between them worth keeping
# apart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  namespace: dogit
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: dogit
spec:
  replicas: 1
  # Recreate for the same reason the database does: /data holds the repositories, and two
  # pods writing into one claim is two pods believing they own the same checkout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          # Pulled from Docker Hub rather than carried into the node's image store by
          # .kube/deploy.sh. "Always" is what survives a node that rebuilds itself: the
          # one thing a development stand cannot do is quietly run yesterday's code.
          image: yudole/dogit:dev-app
          imagePullPolicy: Always
          env:
            - name: DOGIT_ENV
              value: development
            - name: DOGIT_LOG_LEVEL
              value: debug
            # Git hooks log to the pusher's terminal as "remote:" lines, so they stay
            # quiet even when the server logs verbosely.
            - name: DOGIT_HOOK_LOG_LEVEL
              value: warn
            - name: DOGIT_DATABASE_URL
              value: postgres://dogit:dogit@postgres:5432/dogit?sslmode=disable
            - name: DOGIT_DATA_DIR
              value: /data
            - name: DOGIT_REPO_DIR
              value: /data/repos
            - name: DOGIT_ARTIFACT_DIR
              value: /data/artifacts
            - name: DOGIT_HTTP_ADDR
              value: ":8080"
            - name: DOGIT_HOOK_BINARY
              value: /usr/local/bin/dogit-hook
            - name: DOGIT_GIT_BINARY
              value: /usr/bin/git
            # The name this instance is reached by, and the SSH port git is published on.
            # Both show up in what a reader sees — in clone URLs and in the address a
            # module is told to build — so they are set from the domain this cluster is
            # on rather than left to the inside of the cluster.
            - name: DOGIT_PUBLIC_HOST
              value: f220.ru
            - name: DOGIT_SSH_HOST
              value: f220.ru
            - name: DOGIT_SSH_PORT
              value: "2222"
            # The site is served over TLS through the cluster's ingress, so the origin the
            # browser sends is this one and not a guess about a port.
            - name: DOGIT_ALLOWED_ORIGINS
              value: https://f220.ru
          ports:
            - name: http
              containerPort: 8080
            - name: ssh
              containerPort: 22
          resources:
            requests: { cpu: 100m, memory: 256Mi }
          volumeMounts:
            # Repositories, artifacts and objects. The largest thing on this node and the
            # only one whose loss is felt.
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /-/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-data
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: dogit
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Git over SSH, on the container's own port.
    #
    # The one below is for the world, on 2222 through a LoadBalancer. This one is for
    # the modules in this namespace, and it exists because a runner takes the host it
    # clones from out of DOGIT_CORE_URL — the name of this service — and then connects to
    # port twenty-two, which is what an sshd in a container listens on. Without this port
    # on this service that clone is a connection to a closed port, and the job fails at
    # "ssh: connect to host app port 22" with nothing in the log about DNS or sshd.
    - name: ssh
      port: 22
      targetPort: ssh
---
# Git over SSH, published on 2222.
#
# A LoadBalancer rather than a NodePort, because the node's own sshd is on 22 and a NodePort
# cannot be: those live in the 30000 range. The cluster's load balancer pod claims 2222 on
# the node the same way it claims 80 and 443, which is the one mechanism this cluster
# already has for being reachable.
apiVersion: v1
kind: Service
metadata:
  name: app-ssh
  namespace: dogit
spec:
  type: LoadBalancer
  selector:
    app: app
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
