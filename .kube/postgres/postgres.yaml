# The development stand, on one Kubernetes cluster.
#
# The same thirteen services as docker-compose.yml, which is the reference: what a
# setting means here is what it means there, and a change to one of them is a change to
# both. What differs is only how a container is started and how its storage survives —
# a volume instead of a named volume, a ConfigMap instead of a file written into a
# directory both containers share.
#
# Two of these need the node itself rather than the cluster: the runner and the runner
# module hold the node's Docker socket, because the work happens in containers the node's
# daemon creates. Everything else is ordinary.
# The namespace the stand lives in is namespace/namespace.yaml, applied before this file:
# it has to exist before anything is put into it.
#
# PostgreSQL.
#
# A Deployment and not a StatefulSet: one writer, and the storage is a claim that follows
# the pod rather than an identity that does not. The claim is what survives a restart —
# the pod itself is disposable, and so is its name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: dogit
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dogit
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two writers on one claim is a database that stops
    # being a database, and the old pod has to be gone before the new one starts.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:19beta4-alpine
          env:
            - name: POSTGRES_USER
              value: dogit
            - name: POSTGRES_PASSWORD
              value: dogit
            - name: POSTGRES_DB
              value: dogit
            # Deterministic collation keeps index ordering identical everywhere, which
            # is what makes a development stand comparable with production and with the
            # other developer's laptop.
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=C"
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests: { cpu: 100m, memory: 256Mi }
          volumeMounts:
            # PostgreSQL 18+ images keep version-specific subdirectories under
            # /var/lib/postgresql, so the mount must be at that level and not at "data".
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dogit", "-d", "dogit"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dogit
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
