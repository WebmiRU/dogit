# Development stack: PostgreSQL, the dogit application (sshd + web), the CI
# runner and a reverse proxy in front of both the web tier and the SSH port.
#
# Usage from the repository root:
#
#   docker compose up -d --build       start the stack
#   docker compose exec app dogit user create --username alice --password secret123
#   docker compose exec app dogit project create --path hello --owner alice
#
# For development the SSH port stays on 2222 to avoid clashing with the host's
# own sshd. In production change it to "22:22" and terminate TLS elsewhere.

name: dogit

services:
  postgres:
    image: postgres:19beta4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dogit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dogit}
      POSTGRES_DB: ${POSTGRES_DB:-dogit}
      # Deterministic collation keeps index ordering identical everywhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # PostgreSQL 18+ images keep version-specific subdirectories under
      # /var/lib/postgresql, so the mount must be at that level, not at "data".
      - postgres-data:/var/lib/postgresql
    ports:
      # Exposed so psql can be run from the host during development.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dogit} -d ${POSTGRES_DB:-dogit}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOGIT_ENV: ${DOGIT_ENV:-development}
      DOGIT_LOG_LEVEL: ${DOGIT_LOG_LEVEL:-debug}
      DOGIT_DATABASE_URL: postgres://${POSTGRES_USER:-dogit}:${POSTGRES_PASSWORD:-dogit}@postgres:5432/${POSTGRES_DB:-dogit}?sslmode=disable
      DOGIT_DATA_DIR: /data
      DOGIT_REPO_DIR: /data/repos
      DOGIT_ARTIFACT_DIR: /data/artifacts
      DOGIT_HTTP_ADDR: ":8080"
      DOGIT_HOOK_BINARY: /usr/local/bin/dogit-hook
      DOGIT_SSH_HOST: ${DOGIT_SSH_HOST:-localhost}
      DOGIT_GIT_BINARY: /usr/bin/git
    volumes:
      - dogit-data:/data
    ports:
      - "127.0.0.1:8080:8080"
      # Git over SSH. Development keeps 2222; production publishes 22.
      - "127.0.0.1:2222:22"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["dogit", "runner"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOGIT_ENV: ${DOGIT_ENV:-development}
      DOGIT_LOG_LEVEL: ${DOGIT_LOG_LEVEL:-debug}
      DOGIT_DATABASE_URL: postgres://${POSTGRES_USER:-dogit}:${POSTGRES_PASSWORD:-dogit}@postgres:5432/${POSTGRES_DB:-dogit}?sslmode=disable
      DOGIT_DATA_DIR: /data
      DOGIT_REPO_DIR: /data/repos
      DOGIT_ARTIFACT_DIR: /data/artifacts
      DOGIT_RUNNER_CONCURRENCY: ${DOGIT_RUNNER_CONCURRENCY:-2}
    volumes:
      - dogit-data:/data
      # Jobs run in containers; the runner needs access to the Docker socket,
      # which is why it is a separate service and not part of "app".
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  dogit-data: