# Development stack: PostgreSQL, the dogit application (sshd + web), the CI
# runner and a reverse proxy in front of both the web tier and the SSH port.
#
# Usage from the repository root:
#
#   docker compose up -d --build       start the stack
#   docker compose exec app dogit user create --username alice --password secret123
#   docker compose exec app dogit project create --path hello --owner alice
#
# Git over SSH is published on host port 2222 because the host already runs its own
# sshd on 22 while developing. Clone URLs therefore carry a port; the
# ~/.ssh/config snippet below removes the need to type it. In production, publish
# 22 instead ("22:22") and the canonical URL is git@host:group/project.git.

name: dogit

services:
  postgres:
    image: postgres:19beta4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dogit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dogit}
      POSTGRES_DB: ${POSTGRES_DB:-dogit}
      # Deterministic collation keeps index ordering identical everywhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # PostgreSQL 18+ images keep version-specific subdirectories under
      # /var/lib/postgresql, so the mount must be at that level, not at "data".
      - postgres-data:/var/lib/postgresql
    ports:
      # Exposed so psql can be run from the host during development.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dogit} -d ${POSTGRES_DB:-dogit}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOGIT_ENV: ${DOGIT_ENV:-development}
      DOGIT_LOG_LEVEL: ${DOGIT_LOG_LEVEL:-debug}
      # Git hooks log to the pusher's terminal as "remote:" lines, so they stay
      # quiet even when the server logs verbosely.
      DOGIT_HOOK_LOG_LEVEL: ${DOGIT_HOOK_LOG_LEVEL:-warn}
      DOGIT_DATABASE_URL: postgres://${POSTGRES_USER:-dogit}:${POSTGRES_PASSWORD:-dogit}@postgres:5432/${POSTGRES_DB:-dogit}?sslmode=disable
      DOGIT_DATA_DIR: /data
      DOGIT_REPO_DIR: /data/repos
      DOGIT_ARTIFACT_DIR: /data/artifacts
      DOGIT_HTTP_ADDR: ":8080"
      DOGIT_HOOK_BINARY: /usr/local/bin/dogit-hook
      DOGIT_SSH_HOST: ${DOGIT_SSH_HOST:-localhost}
      # Client-facing SSH port. It shows up in clone URLs because it is not 22
      # during development; production publishes 22 and omits it.
      DOGIT_SSH_PORT: ${DOGIT_SSH_PORT:-2222}
      DOGIT_ALLOWED_ORIGINS: ${DOGIT_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      # The name this instance is reached by. Modules that need an address of
      # their own build it from this, so the rule for what the registry is called
      # lives in one place instead of in every deployment file.
      DOGIT_PUBLIC_HOST: ${DOGIT_PUBLIC_HOST:-localhost}
      DOGIT_TLS_SERVER_NAME: ${DOGIT_TLS_SERVER_NAME:-}
      DOGIT_GIT_BINARY: /usr/bin/git
      # Artifacts and build caches live in S3-compatible object storage, so a
      # runner on another machine sees the same files and nothing is lost when a
      # container is replaced.
      DOGIT_S3_ENDPOINT: ${DOGIT_S3_ENDPOINT:-}
      DOGIT_S3_ACCESS_KEY: ${DOGIT_S3_ACCESS_KEY:-}
      DOGIT_S3_SECRET_KEY: ${DOGIT_S3_SECRET_KEY:-}
      DOGIT_S3_BUCKET: ${DOGIT_S3_BUCKET:-}
      DOGIT_S3_REGION: ${DOGIT_S3_REGION:-us-east-1}
      DOGIT_OBJECTS_PREFIX: ${DOGIT_OBJECTS_PREFIX:-dogit}
    volumes:
      - dogit-data:/data
    ports:
      - "127.0.0.1:8080:8080"
      # Git over SSH. Host port 2222 during development, 22 in production.
      - "2222:22"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      routes:
        condition: service_started
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - dogit-routes:/etc/nginx/dogit-modules:ro
    environment:
      # The SPA calls the API through the same origin, so no CORS is involved.
      NUXT_PUBLIC_API_BASE: /api/v1

  # Keeps the proxy's module configuration in step with what is installed.
  #
  # This is the same command Kubernetes would run to fill a ConfigMap, and neither
  # knows which it is in: installing a module never means editing the web image or
  # hand-writing nginx configuration.
  routes:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["dogit", "module", "routes", "--nginx", "--watch", "--output", "/etc/nginx/dogit-modules/modules.conf"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOGIT_DATABASE_URL: postgres://${POSTGRES_USER:-dogit}:${POSTGRES_PASSWORD:-dogit}@postgres:5432/${POSTGRES_DB:-dogit}?sslmode=disable
      DOGIT_PUBLIC_HOST: ${DOGIT_PUBLIC_HOST:-localhost}
      DOGIT_TLS_SERVER_NAME: ${DOGIT_TLS_SERVER_NAME:-}
      DOGIT_LOG_LEVEL: ${DOGIT_LOG_LEVEL:-info}
    volumes:
      - dogit-routes:/etc/nginx/dogit-modules

  # The registry: an authorisation proxy in front of registry:2.
  #
  # Two services because they are two things. The proxy decides who may push what,
  # and needs nothing but the core; the registry stores bytes and knows nothing
  # about anybody. Splitting them is what lets the proxy be restarted or replaced
  # without touching the images, and the images survive the proxy being down.
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - dogit-registry:/var/lib/registry

  module-registry:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["module-registry"]
    depends_on:
      app:
        condition: service_healthy
      registry:
        condition: service_started
    environment:
      DOGIT_CORE_URL: http://app:8080
      DOGIT_MODULE_ENDPOINT: http://module-registry:8091
      # The address a docker client uses. During development it is the published
      # host port; in production it is the module's own name on 443, which is what
      # the shared web server routes here.
      DOGIT_MODULE_PUBLIC_URL: ${DOGIT_REGISTRY_PUBLIC_URL:-http://127.0.0.1:8091}
      # The project's own page reads images from this module, so the module has to
      # answer a browser on the instance's address. Named explicitly rather than
      # left open: the answer is per project, and the credential is short.
      DOGIT_MODULE_ALLOWED_ORIGINS: ${DOGIT_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      # Written once, at registration: the module is published on a host port during
      # development and on its own name in production, and the project's page has to
      # be told which it is. An operator changes it in the module's settings.
      DOGIT_REGISTRY_PUBLIC_ADDRESS: ${DOGIT_REGISTRY_PUBLIC_ADDRESS:-http://127.0.0.1:8091}
      DOGIT_MODULE_TOKEN: ${DOGIT_MODULE_TOKEN:-}
      REGISTRY_URL: http://registry:5000
      REGISTRY_STORAGE_DIR: /var/lib/registry
      # Published to the host during development. In production the module is
      # reached through the shared web server on 80/443, under a name of its own.
      DOGIT_MODULE_LISTEN: ":8091"
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - dogit-registry:/var/lib/registry:ro

  # A runner: claims jobs and builds images.
  #
  # It is a module rather than part of the core so that it can live on a machine
  # the deployment knows nothing about — a virtual machine with a usable Docker,
  # where building images is allowed. Nothing here depends on it being in the same
  # compose file, which is the point.
  module-runner:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["module-runner"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOGIT_CORE_URL: http://app:8080
      DOGIT_MODULE_ENDPOINT: http://module-runner:8092
      DOGIT_MODULE_TOKEN: ${DOGIT_MODULE_TOKEN:-}
      DOGIT_RUNNER_CONCURRENCY: ${DOGIT_RUNNER_CONCURRENCY:-1}
      DOGIT_RUNNER_WORKSPACE: /data/work
      DOGIT_DOCKER_BINARY: /usr/bin/docker
    # The socket's group, so the client inside the container is allowed to talk to
    # it. Running as root is the other way and is how a build ends up able to do
    # anything at all; a group id is the smallest thing that works.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - dogit-runner-work:/data
      # The socket, because this is the machine that runs the jobs. A runner without
      # it would be a runner that cannot do anything.
      # Mounted at /run/docker.sock rather than /var/run/docker.sock: inside the
      # image /var/run is a symlink to ../run, and a file mounted through it lands
      # somewhere the process never looks.
      - /var/run/docker.sock:/run/docker.sock

  # Notifications to Telegram.
  #
  # The token is in the environment rather than in this file, because a bot token
  # in a repository is a bot token in every clone of it.
  module-notify-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["module-notify-telegram"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOGIT_CORE_URL: http://app:8080
      DOGIT_MODULE_ENDPOINT: http://module-notify-telegram:8093
      DOGIT_MODULE_TOKEN: ${DOGIT_MODULE_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DOGIT_PUBLIC_HOST: ${DOGIT_PUBLIC_HOST:-localhost}
      DOGIT_PUBLIC_URL: ${DOGIT_PUBLIC_URL:-}

  # Reference implementation of the module protocol. It has no product
  # behaviour: it exists to prove that registration, heartbeats and
  # introspection work before the real modules are built.
  module-demo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["module-cache-demo"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOGIT_CORE_URL: http://app:8080
      DOGIT_MODULE_ENDPOINT: http://module-demo:8090
      DOGIT_MODULE_NAME: ${DOGIT_MODULE_DEMO_NAME:-demo}
      # Instance token: created with "dogit module token create" and stored here.
      DOGIT_MODULE_TOKEN: ${DOGIT_MODULE_TOKEN:-}
      # What the module reports about the storage it uses. It is a directory of
      # its own rather than the instance's, so its numbers mean something.
      MODULE_CACHE_DIR: /data/cache
    volumes:
      - dogit-module-cache:/data
    ports:
      - "127.0.0.1:8090:8090"

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["dogit", "runner"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOGIT_ENV: ${DOGIT_ENV:-development}
      DOGIT_LOG_LEVEL: ${DOGIT_LOG_LEVEL:-debug}
      DOGIT_DATABASE_URL: postgres://${POSTGRES_USER:-dogit}:${POSTGRES_PASSWORD:-dogit}@postgres:5432/${POSTGRES_DB:-dogit}?sslmode=disable
      DOGIT_DATA_DIR: /data
      DOGIT_REPO_DIR: /data/repos
      DOGIT_ARTIFACT_DIR: /data/artifacts
      DOGIT_RUNNER_CONCURRENCY: ${DOGIT_RUNNER_CONCURRENCY:-2}
      DOGIT_S3_ENDPOINT: ${DOGIT_S3_ENDPOINT:-}
      DOGIT_S3_ACCESS_KEY: ${DOGIT_S3_ACCESS_KEY:-}
      DOGIT_S3_SECRET_KEY: ${DOGIT_S3_SECRET_KEY:-}
      DOGIT_S3_BUCKET: ${DOGIT_S3_BUCKET:-}
      DOGIT_S3_REGION: ${DOGIT_S3_REGION:-us-east-1}
      DOGIT_OBJECTS_PREFIX: ${DOGIT_OBJECTS_PREFIX:-dogit}
    volumes:
      - dogit-data:/data
      # Jobs run in containers; the runner needs access to the Docker socket,
      # which is why it is a separate service and not part of "app".
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  dogit-data:
  # The generated proxy configuration, shared between the writer and the reader.
  dogit-routes:
  # The demo module's cache. A volume of its own so that what it reports about
  # disk usage is about something real.
  dogit-module-cache:
  # The images themselves, shared between the registry that writes them and the
  # module that reports how much of the disk they take.
  dogit-registry:
  # Checkouts a runner makes. Its own volume, so that a runner can be replaced
  # without losing the workspace it was in the middle of using.
  dogit-runner-work: